services:
  db:
    container_name: db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: koemment
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: koemment
    volumes:
      - koemment_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koemment -d koemment"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-1000}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - APP_ORIGIN=${APP_ORIGIN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SYNC_TOKEN=${SYNC_TOKEN}
    ports:
      - "${PORT:-1000}:${PORT:-1000}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - koemment

volumes:
  koemment_data:

networks:
  koemment:
    name: koemment