name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koemment
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: koemment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koemment -d koemment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://koemment:changeme@localhost:5432/koemment?schema=public
      BETTER_AUTH_SECRET: ci-test-secret-do-not-use-in-production
      SYNC_TOKEN: ci-test-sync-token
      PORT: 1000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply migrations
        run: pnpm --filter api run db:deploy

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
